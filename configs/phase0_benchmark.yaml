# Phase 0 hardware benchmark (python -m common.benchmark --config configs/phase0_benchmark.yaml)
seed: 0
cpu_threads: 8
allow_tf32: false
encoder_devices: [cuda, cpu]
encoder_batch: 256
encoder_reps: 20
solver_cases:
  - {device: cuda, n: 64, batch: 256, dtype: float64, steps: 50}
  - {device: cuda, n: 64, batch: 1024, dtype: float64, steps: 20}
  - {device: cuda, n: 128, batch: 256, dtype: float64, steps: 20}
  - {device: cpu, n: 64, batch: 256, dtype: float64, steps: 5}
output_json: results/phase0/benchmark.json
