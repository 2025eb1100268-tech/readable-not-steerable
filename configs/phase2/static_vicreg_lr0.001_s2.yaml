# Phase 2 run, selected config (python -m train.train --config configs/phase2/static_vicreg_lr0.001_s2.yaml)
data_dir: data/generated/v1
weight_decay: 0.05
batch: 256
epochs: 40
warmup_frac: 0.05
amp_bf16: true
ema_start: 0.996
loss_weights:
  pred: 25.0
  var: 25.0
  cov: 1.0
predictor_width: 256
log_every: 100
eval_every_epochs: 4
collapse:
  min_effective_rank: 8
  min_std_median: 0.1
model: static_vicreg
lr: 0.001
seed: 2
run_name: static_vicreg_lr0.001_s2
