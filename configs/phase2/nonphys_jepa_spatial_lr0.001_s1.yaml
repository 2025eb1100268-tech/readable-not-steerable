# Phase 2 run, selected config (python -m train.train --config configs/phase2/nonphys_jepa_spatial_lr0.001_s1.yaml)
data_dir: data/generated/nonphys_v1
weight_decay: 0.05
batch: 256
epochs: 40
warmup_frac: 0.05
amp_bf16: true
ema_start: 0.996
loss_weights:
  pred: 25.0
  var: 25.0
  cov: 1.0
predictor_width: 256
log_every: 100
eval_every_epochs: 4
collapse:
  min_effective_rank: 8
  min_std_median: 0.1
model: jepa_spatial
lr: 0.001
seed: 1
run_name: nonphys_jepa_spatial_lr0.001_s1
