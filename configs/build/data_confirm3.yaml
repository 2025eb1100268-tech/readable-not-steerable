# [BUILD] confirmation set confirm3, SEALED (python -m data.generate --config configs/build/data_confirm3.yaml)
# Same recipe as confirm_v2 (and explore), new seed. Loadable only after data.seal.unseal(prereg="PREREGISTRATION_v3.md"),
# which only a future Stage 5 script calls, after PREREGISTRATION_v3.md is committed.
seed: 20261019
device: cuda
cpu_threads: 8
n: 64
cfl: 0.3
dt_out: 0.04
n_traj: 1080
inviscid_fraction: 0.35
frames_viscous: 64
frames_inviscid: 24
nu_range: [0.003, 0.05]
batch: 250

ic:
  blob_fraction: 0.5
  blob_count: [2, 12]
  blob_radius: [0.25, 0.6]
  spectral_k0: [2.0, 5.0]
  omega_rms: [2.0, 4.0]

split:
  mode: single
  label: confirm3
  exclude_re_band_from: data/generated/v1

input_scale_from: data/generated/v1
sealed: true
sealed_for: PREREGISTRATION_v3.md
log_title: "[BUILD] data generation: confirm3 (sealed for PREREGISTRATION_v3.md; counts and checksums only)"
out_dir: data/generated/confirm3
