# [BUILD] Stage 2b readouts (python -m dials.stage1 --config configs/build/stage2b_eval.yaml). PREDICTIONS entries 2 and 5.
title: '# [BUILD] Stage 2b: M2-SW (spectrally whitened content) and the M2-SF attribution seed, omega-only loss (exploratory)'
intro: 'Definitions and predictions: results/build/PREDICTIONS.md entries 2 and 5. M2-SW''s content encoder sees the spectrally whitened input (dials/whiten.py: RMS-normalized, every shell k = 1..21 set to a fixed reference power, gain capped at 1000, the mean and k > 21 zeroed), so loudness and (where the cap does not bind) spectral shape can reach the decoder only through the dials: shape information in the dials is a design property. The finding is whether label-free analysis of the dials yields separate loudness and shape directions that each steer cleanly and pass realism. PCA of the dial vector is the primary method; the effect-space directions ES1-4 are secondary. Both models use the omega-only loss (psi derived and reported). One rendered field: no head-consistency criterion.'
log_title: '[BUILD] Stage 2b readouts (M2-SW, M2-SF omega-only)'
stage_label: Stage 2b
seed: 0
