# [BUILD] Step B readouts (python -m dials.stepB --config configs/build/stepB_eval.yaml). PREDICTIONS entry 8.
# calibrated_dose: results/build/stepB_calibration.md (ridge R^2 of s from the content input's log shell powers)
seed: 0
data_parts:
- - data/generated/v1
  - - train
    - val
- - data/generated/explore_v2
  - - explore
- - data/generated/matched_energy_v2
  - - matched
cache_tag: v1tv_explore_matched
n_frames: 256
n_envelope: 4096
n_opt_frames: 256
opt_seed: 1
opt_steps: 150
opt_batch: 32
opt_lr: 0.05
n_random_inits: 4
artefact:
  artefact_oob_share: 0.01
  artefact_max_frame_fraction: 0.01
criteria:
  min_effect: 0.2
  min_monotonicity: 0.9
  min_cycle_corr: 0.9
  cycle_gain:
  - 0.5
  - 2.0
  max_shared_pattern: 0.5
  envelope_rel_margin: 0.05
  max_head_ratio: 1.5
  max_sigma_loudness: 0.2
  min_sigma_shape: 0.7
  min_seeds: 2
groups:
  '0':
  - b3_sn_t0_s0
  - b3_sn_t0_s1
  - b3_sn_t0_s2
  '0.5':
  - b3_sn_t0p5_s0
  - b3_sn_t0p5_s1
  - b3_sn_t0p5_s2
  '1':
  - b3_sn_t1_s0
  - b3_sn_t1_s1
  - b3_sn_t1_s2
  '2':
  - b3_sn_t2_s0
  - b3_sn_t2_s1
  - b3_sn_t2_s2
references:
  vorticity AE:
  - s2_ae_vorticity_k0_lr0.001_s0
  - s2_ae_vorticity_k0_lr0.001_s1
  - s2_ae_vorticity_k0_lr0.001_s2
  streamfunction AE:
  - s2_ae_streamfunction_k0_lr0.001_s0
  - s2_ae_streamfunction_k0_lr0.001_s1
  - s2_ae_streamfunction_k0_lr0.001_s2
  vorticity AE + VICReg:
  - s2_ae_vorticity_vicreg_k0_lr0.001_s0
  - s2_ae_vorticity_vicreg_k0_lr0.001_s1
  - s2_ae_vorticity_vicreg_k0_lr0.001_s2
  streamfunction AE + VICReg:
  - s2_ae_streamfunction_vicreg_k0_lr0.001_s0
  - s2_ae_streamfunction_vicreg_k0_lr0.001_s1
  - s2_ae_streamfunction_vicreg_k0_lr0.001_s2
reference_json: results/explore/stage2/runs/{run}.json
runs_json: results/build/stepB/runs/{run}.json
stepA_json: results/build/stepA.json.gz
calibrated_dose:
  '0': 0.966
  '0.5': 0.294
  '1': 0.181
  '2': 0.066
output_md: results/build/stepB.md
output_json_gz: results/build/stepB.json.gz
figure: results/build/stepB.png
